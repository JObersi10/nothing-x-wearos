org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Configure-on-demand means `./gradlew :protocol:test` only evaluates the
# protocol/ build script, not wear/phone/bluetooth's. That matters in sandboxes
# where the Android Gradle Plugin can't be resolved (dl.google.com blocked) but
# the plain-Kotlin protocol module still needs to build and run its tests.
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
