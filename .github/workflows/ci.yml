name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships a working Android SDK (ANDROID_HOME, licenses
      # pre-accepted). android-actions/setup-android@v3 was tried here first but
      # fails outright: it requests the legacy "tools" package, which Google
      # removed from the SDK repository, so `sdkmanager` exits 1 before doing
      # anything useful. Relying on the runner's preinstalled SDK avoids that;
      # this step just makes sure the exact platform/build-tools this project
      # needs are present, since the preinstalled set can lag a fresh compileSdk.
      - name: Ensure required SDK platform and build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager | sort -V | tail -1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Pure-Kotlin protocol module: the part that's actually testable in any
      # sandbox, including the one this repo was first built in. Runs first so
      # a protocol regression fails fast before spending time on Android build.
      - name: protocol unit tests
        run: ./gradlew :protocol:test --console=plain

      - name: bluetooth module build
        run: ./gradlew :bluetooth:assembleDebug --console=plain

      - name: wear debug APK
        run: ./gradlew :wear:assembleDebug --console=plain

      - name: phone debug APK
        run: ./gradlew :phone:assembleDebug --console=plain

      - name: Upload wear debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug-apk
          path: wear/build/outputs/apk/debug/*.apk

      - name: Upload phone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug-apk
          path: phone/build/outputs/apk/debug/*.apk

      - name: Upload protocol test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-results
          path: protocol/build/test-results/test/*.xml
